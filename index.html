<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="description" content="One Created Life is being reimagined. A thoughtful new online home is coming soon." />
    <title>One Created Life | A New Chapter Is Coming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <style>
      :root {
        --paper: #fbfbf8;
        --warm: #f6f3ec;
        --ink: #2a2622;
        --muted: #7c736a;
        --yellow: #ffcc33;
        --yellow-deep: #e6b520;
        --line: #d8d3c9;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 320px;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 78% 18%, rgba(255, 204, 51, 0.1), transparent 24rem),
          var(--paper);
        color: var(--ink);
        font-family: "Poppins", "Avenir Next", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        padding: clamp(1.5rem, 3vw, 2.75rem) clamp(1.25rem, 5vw, 5rem);
        isolation: isolate;
      }

      .page::before {
        position: absolute;
        z-index: -1;
        top: clamp(7rem, 18vh, 12rem);
        right: clamp(-9rem, -5vw, -3rem);
        width: clamp(17rem, 33vw, 34rem);
        aspect-ratio: 1;
        border: 1.5px solid var(--yellow-deep);
        border-radius: 50% 50% 1.5rem 1.5rem;
        background: var(--warm);
        content: "";
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        white-space: nowrap;
      }

      .brand-mark {
        display: block;
        width: 0.45rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--yellow);
        color: transparent;
        font-size: 0;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 0.55rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 0.35rem rgba(255, 204, 51, 0.16);
      }

      main {
        display: flex;
        align-items: center;
        padding: clamp(4rem, 10vh, 8rem) 0;
      }

      .content {
        width: min(100%, 51rem);
        margin-left: clamp(0rem, 4vw, 4rem);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin: 0 0 clamp(1.5rem, 3vw, 2.5rem);
        color: var(--yellow-deep);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2.7rem;
        height: 1px;
        background: var(--yellow-deep);
        content: "";
      }

      h1 {
        max-width: 12.5ch;
        margin: 0;
        font-size: clamp(3rem, 5.8vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.06;
        text-wrap: balance;
      }

      h1 em {
        display: inline-block;
        padding: 0 0.12em;
        border-radius: 0.18rem;
        background: linear-gradient(transparent 18%, rgba(255, 204, 51, 0.62) 18%, rgba(255, 204, 51, 0.62) 92%, transparent 92%);
        font-style: normal;
        font-weight: 500;
      }

      .intro {
        max-width: 35rem;
        margin: clamp(2rem, 4vw, 3.25rem) 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.7;
      }

      @media (max-width: 680px) {
        body {
          background:
            radial-gradient(circle at 100% 25%, rgba(255, 204, 51, 0.1), transparent 17rem),
            var(--paper);
        }

        .page { padding: 1.35rem 1.25rem 1.5rem; }

        .page::before {
          top: 24%;
          right: -10rem;
        }

        .brand {
          font-size: 1.05rem;
        }

        .status {
          font-size: 0.57rem;
          letter-spacing: 0.13em;
        }

        main { padding: 4.5rem 0 5rem; }
        .content { margin-left: 0; }

        h1 {
          max-width: 11ch;
          font-size: clamp(2.65rem, 12vw, 3.5rem);
          line-height: 1.08;
        }

        .intro {
          max-width: 28rem;
          font-size: 1rem;
          line-height: 1.65;
        }

      }

      @media (prefers-reduced-motion: no-preference) {
        .content > * {
          animation: enter 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .content > :nth-child(2) { animation-delay: 90ms; }
        .content > :nth-child(3) { animation-delay: 180ms; }

        @keyframes enter {
          from {
            opacity: 0;
            transform: translateY(1rem);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="One Created Life">
          <span class="brand-mark" aria-hidden="true">O</span>
          <span>One Created Life</span>
        </div>
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Coming soon
        </div>
      </header>

      <main>
        <div class="content">
          <p class="eyebrow">A new chapter</p>
          <h1>Something <em>new</em> is taking shape.</h1>
          <p class="intro">
            This space is being thoughtfully reimagined. A new online home for
            better brands, honest expression, and building an aligned life is
            coming soon.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
